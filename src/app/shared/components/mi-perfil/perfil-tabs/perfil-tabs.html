<div class="border-b border-base-200 px-6 pt-4 overflow-x-auto">
  <div class="flex gap-1 min-w-max">

    <button
      class="flex items-center gap-2 px-4 py-3 text-sm font-medium rounded-t-lg border-b-2 transition-all duration-200"
      [class.border-primary]="activeTab() === 'info'"
      [class.text-primary]="activeTab() === 'info'"
      [class.border-transparent]="activeTab() !== 'info'"
      [class.text-base-content/60]="activeTab() !== 'info'"
      (click)="setTab('info')">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      Información Personal
    </button>

    <button
      class="flex items-center gap-2 px-4 py-3 text-sm font-medium rounded-t-lg border-b-2 transition-all duration-200"
      [class.border-primary]="activeTab() === 'seguridad'"
      [class.text-primary]="activeTab() === 'seguridad'"
      [class.border-transparent]="activeTab() !== 'seguridad'"
      [class.text-base-content/60]="activeTab() !== 'seguridad'"
      (click)="setTab('seguridad')">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
      Seguridad
    </button>

    <button
      class="flex items-center gap-2 px-4 py-3 text-sm font-medium rounded-t-lg border-b-2 transition-all duration-200"
      [class.border-primary]="activeTab() === 'asignaciones'"
      [class.text-primary]="activeTab() === 'asignaciones'"
      [class.border-transparent]="activeTab() !== 'asignaciones'"
      [class.text-base-content/60]="activeTab() !== 'asignaciones'"
      (click)="setTab('asignaciones')">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
      Mis Asignaciones
      @if (asignacionesCount() > 0) {
        <span class="badge badge-primary badge-xs">{{ asignacionesCount() }}</span>
      }
    </button>

  </div>
</div>
