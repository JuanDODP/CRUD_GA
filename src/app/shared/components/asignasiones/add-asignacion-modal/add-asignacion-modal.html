<input #modalCheckbox type="checkbox" id="modal-asignacion-manual" class="modal-toggle" />

<div class="modal" role="dialog">
  <div class="modal-box border border-primary/10 shadow-2xl bg-base-100 max-w-md p-0 overflow-hidden">

    <div class="bg-primary/5 p-6 border-b border-primary/10">
      <h3 class="text-xl font-bold text-primary flex items-center gap-3">
        <div class="bg-primary text-primary-content p-2 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
        </div>
      {{updateorcreate()===0?  'Nueva Asignación ': `Editar Asignación ${this.selectAsignacion()?.id}`}}
      </h3>
    </div>

    <form class="p-6 space-y-5" [formGroup]="addAsignacion" (ngSubmit)="onSubmit()">

      <div class="form-control w-full">
        <label class="label pt-0">
          <span class="label-text font-bold opacity-70 uppercase text-xs tracking-widest">Responsable</span>
        </label>
        <div class="relative">
          <select class="select select-bordered w-full bg-base-200/50 focus:outline-primary" formControlName="idUser">
            <option disabled selected>Selecciona un integrante...</option>
            @for (item of usuarios(); track item.id) {

            <option [value]="item.id">{{ item.name }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-control w-full">
        <label class="label pt-0">
          <span class="label-text font-bold opacity-70 uppercase text-xs tracking-widest">Proyecto Destino</span>
        </label>
        <select class="select select-bordered w-full bg-base-200/50 focus:outline-primary" formControlName="idArea">
          <option disabled selected>¿A qué proyecto se une?</option>
          @for (item of proyectos(); track item.id) {

          <option [value]="item.id">{{ item.nombreProyecto }}</option>
          }

        </select>
      </div>

      <div class="form-control w-full">
        <label class="label pt-0">
          <span class="label-text font-bold opacity-70 uppercase text-xs tracking-widest">Fecha de Registro</span>
        </label>
        <input type="date" class="input input-bordered w-full bg-base-200/50 focus:outline-primary appearance-none"
          formControlName="fechaAsignacion" />
      </div>

       @if (hasError()) {
        <app-alert-error />
      }

      <div class="modal-action mt-8 pt-4 border-t border-base-300">
        <label for="modal-asignacion-manual" class="btn btn-ghost hover:bg-error/10 hover:text-error transition-colors">
          Cancelar
        </label>
        <button type="submit" class="btn btn-primary px-8 shadow-lg shadow-primary/20">
         {{ updateorcreate()===0?  'Confirmar Asignación ': `Actualizar Asignación`}}
        </button>
      </div>
    </form>

  </div>

  <label class="modal-backdrop backdrop-blur-sm bg-black/40" for="modal-asignacion-manual">Close</label>
</div>
