<div class="p-4 md:p-8 bg-base-200 min-h-screen">
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-primary">Gestión de Proyectos</h1>
      <p class="text-sm text-gray-500">
        Administra los proyectos de la organización
      </p>
    </div>

    <button class="btn btn-primary shadow-lg">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
        viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 4v16m8-8H4" />
      </svg>
      Agregar Proyecto
    </button>
  </div>

  <!-- Table Card -->
  <div class="card bg-base-100 shadow-xl">
    <div class="overflow-x-auto">
      <table class="table table-zebra w-full">
        <thead>
          <tr class="bg-primary text-white">
            <th>ID</th>
            <th>Proyecto</th>
            <th>Inicio</th>
            <th>Fin</th>
            <th>Área</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <th class="font-mono text-xs">#501</th>
            <td class="font-bold">Sistema de Nómina</td>
            <td>2024-01-15</td>
            <td>2024-06-30</td>
            <td class="badge badge-outline badge-info">
              Área 101
            </td>
            <td class="flex justify-center gap-2">
              <!-- Edit -->
              <button
                class="btn btn-square btn-sm btn-outline btn-info"
                title="Editar">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                  fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2"
                    d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                </svg>
              </button>

              <!-- Delete -->
              <button
                class="btn btn-square btn-sm btn-outline btn-error"
                title="Eliminar">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                  fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
