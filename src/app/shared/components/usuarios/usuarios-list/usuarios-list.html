@if (isSuccess()) {
<app-alert-sucess />
}
@if (isError()) {
<action-alert-error message="Acción denegada: El área cuenta con dependencias activas en el módulo de Proyectos." />
}

<div class="p-4 md:p-8 bg-base-200 min-h-screen">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-primary">Gestión de Usuarios</h1>
      <p class="text-sm text-gray-500">Administra los accesos y perfiles de la organización</p>
    </div>

    <label for="modal-usuario-manual" class="btn btn-primary shadow-lg cursor-pointer" (click)="clear()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
      </svg>
      Nuevo Usuario
    </label>
  </div>

  <div class="card bg-base-100 shadow-xl">
    <div class="overflow-x-auto">
      <table class="table table-zebra w-full">
        <thead>
          <tr class="bg-primary text-white">
            <th>ID</th>
            <th>Perfil</th>
            <th>Nombre</th> <th>Correo Electrónico</th>
            <th>Rol</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (user of usuarios(); track user.id) {
          <tr>
            <th class="font-mono text-xs">{{ user.id }}</th>

            <td>
              <label for="modal-image-preview" class="cursor-zoom-in" (click)="
                clear();
                getUsuarios(user)">
                <div class="avatar">
                  <div class="mask mask-squircle w-10 h-10 hover:scale-110 transition-transform duration-200">
                    <img [src]="user.imagen || 'assets/no-image.png'" [alt]="user.name" />
                  </div>
                </div>
              </label>
            </td>

            <td>{{ user.name }}</td> <td>{{ user.email }}</td>

            <td>
              <span class="badge badge-ghost badge-sm uppercase font-semibold">
                {{ user.rol }}
              </span>
            </td>

            <td class="flex justify-center gap-2">
              <label for="modal-usuario-manual" class="btn btn-square btn-sm btn-outline btn-info cursor-pointer"
                title="Editar"
                (click)="clear(); getUsuarios(user)"
                >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                </svg>
              </label>

              <label

              for="modal-delete-confirm" class="btn btn-square btn-sm btn-outline btn-error cursor-pointer"
                title="Eliminar"
                (click)="clear(); getUsuarios(user)"
                >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </label>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
