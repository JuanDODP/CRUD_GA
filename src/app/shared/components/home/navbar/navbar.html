<div class="navbar-end gap-2">
  @if (authStatus() === 'authenticated') {
    <!-- Avatar clicable → /mi-perfil -->
    <a routerLink="/mi-perfil"
      class="flex items-center gap-2 btn btn-ghost btn-sm rounded-full pr-3 hover:bg-base-200 transition-colors">
      @if (user()?.name) {
        <div class="avatar placeholder">
          <div class="bg-primary text-primary-content rounded-full w-8 h-8 text-xs font-bold">
            <span>{{ getInitials(user()!.name) }}</span>
          </div>
        </div>
      }
      <span class="hidden sm:inline text-sm font-medium max-w-28 truncate">{{ user()?.name }}</span>
    </a>
    <button class="btn btn-sm btn-error" (click)="logout()">
      Salir
    </button>
  }
  @else if(authStatus() === 'not-authenticated') {
    <a class="btn btn-sm btn-primary" routerLink="/auth/login">
      Iniciar Sesión
    </a>
  }
  @else {
    <span class="loading loading-spinner loading-xs opacity-50"></span>
  }
</div>
</div>
