<div class="flex flex-col gap-3">
  <!-- Column header -->
  <div class="flex items-center justify-between px-1">
    <div class="flex items-center gap-2">
      <span
        class="w-2.5 h-2.5 rounded-full"
        [class]="dotClass()"
        [class.animate-pulse]="pulse()"
      ></span>
      <span class="text-sm font-bold text-base-content">{{ titulo() }}</span>
    </div>
    <div class="badge badge-sm font-bold" [class]="badgeClass()">{{ items().length }}</div>
  </div>

  <!-- Cards -->
  <div class="space-y-3 overflow-y-auto pr-0.5" style="max-height: calc(100vh - 300px);">
    @for (item of items(); track item.proyecto.id) {
      <app-tablero-card
        [item]="item"
        [expanded]="expandedId() === item.proyecto.id"
        (toggleExpand)="cardToggle.emit(item.proyecto.id)"
      />
    } @empty {
      <div class="flex flex-col items-center justify-center py-10 text-base-content/25 rounded-2xl border-2 border-dashed border-base-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
        </svg>
        <p class="text-xs text-center px-4">Sin proyectos</p>
      </div>
    }
  </div>
</div>
