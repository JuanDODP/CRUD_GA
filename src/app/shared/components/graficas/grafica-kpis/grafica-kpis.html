<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">

  <div class="card bg-base-100 shadow-sm col-span-1">
    <div class="card-body p-4">
      <p class="text-[10px] font-bold text-base-content/30 uppercase tracking-widest mb-1">Proyectos</p>
      <p class="text-2xl font-bold text-base-content">{{ kpis().total }}</p>
      <p class="text-[10px] text-base-content/30 mt-0.5">registrados</p>
    </div>
  </div>

  <div class="card bg-base-100 shadow-sm col-span-1" style="border-top: 3px solid #22c55e">
    <div class="card-body p-4">
      <p class="text-[10px] font-bold text-success/60 uppercase tracking-widest mb-1">Activos</p>
      <p class="text-2xl font-bold text-success">{{ kpis().activos }}</p>
      <p class="text-[10px] text-base-content/30 mt-0.5">en ejecución</p>
    </div>
  </div>

  <div class="card bg-base-100 shadow-sm col-span-1">
    <div class="card-body p-4">
      <p class="text-[10px] font-bold text-base-content/30 uppercase tracking-widest mb-1">Asignaciones</p>
      <p class="text-2xl font-bold text-base-content">{{ kpis().asignaciones }}</p>
      <p class="text-[10px] text-base-content/30 mt-0.5">en total</p>
    </div>
  </div>

  <div class="card bg-base-100 shadow-sm col-span-1">
    <div class="card-body p-4">
      <p class="text-[10px] font-bold text-base-content/30 uppercase tracking-widest mb-1">Usuarios</p>
      <p class="text-2xl font-bold text-base-content">{{ kpis().usuarios }}</p>
      <p class="text-[10px] text-base-content/30 mt-0.5">registrados</p>
    </div>
  </div>

  <div class="card bg-base-100 shadow-sm col-span-1" style="border-top: 3px solid #8b5cf6">
    <div class="card-body p-4">
      <p class="text-[10px] font-bold text-primary/60 uppercase tracking-widest mb-1">Cobertura</p>
      <p class="text-2xl font-bold text-primary">{{ kpis().cobertura }}<span class="text-sm font-medium">%</span></p>
      <p class="text-[10px] text-base-content/30 mt-0.5">con asignación</p>
    </div>
  </div>

  <div class="card bg-base-100 shadow-sm col-span-1" style="border-top: 3px solid #f59e0b">
    <div class="card-body p-4">
      <p class="text-[10px] font-bold text-warning/60 uppercase tracking-widest mb-1">Promedio</p>
      <p class="text-2xl font-bold text-warning">{{ kpis().promAsig }}</p>
      <p class="text-[10px] text-base-content/30 mt-0.5">asig / usuario</p>
    </div>
  </div>

</div>
