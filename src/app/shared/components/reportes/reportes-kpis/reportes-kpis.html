<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">

  <!-- Áreas -->
  <div class="card bg-base-100 shadow-xl overflow-hidden">
    <div class="h-1 bg-primary"></div>
    <div class="card-body p-5">
      <div class="flex items-start justify-between">
        <div>
          <p class="text-xs font-semibold text-base-content/50 uppercase tracking-widest">Áreas</p>
          <p class="text-4xl font-bold text-primary font-mono mt-1">{{ totalAreas() }}</p>
          <p class="text-xs text-base-content/40 mt-1">Departamentos</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Proyectos -->
  <div class="card bg-base-100 shadow-xl overflow-hidden">
    <div class="h-1 bg-secondary"></div>
    <div class="card-body p-5">
      <div class="flex items-start justify-between">
        <div>
          <p class="text-xs font-semibold text-base-content/50 uppercase tracking-widest">Proyectos</p>
          <p class="text-4xl font-bold text-secondary font-mono mt-1">{{ totalProyectos() }}</p>
          <div class="flex items-center gap-1 mt-1">
            <span class="text-xs text-success font-medium">{{ activosCount() }} activos</span>
            <span class="text-xs text-base-content/30">·</span>
            <span class="text-xs text-error font-medium">{{ vencidosCount() }} vencidos</span>
          </div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-secondary/10 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Asignaciones -->
  <div class="card bg-base-100 shadow-xl overflow-hidden">
    <div class="h-1 bg-accent"></div>
    <div class="card-body p-5">
      <div class="flex items-start justify-between">
        <div>
          <p class="text-xs font-semibold text-base-content/50 uppercase tracking-widest">Asignaciones</p>
          <p class="text-4xl font-bold text-accent font-mono mt-1">{{ totalAsignaciones() }}</p>
          <p class="text-xs text-base-content/40 mt-1">~{{ promedioAsig() }} por usuario</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-accent/10 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Usuarios -->
  <div class="card bg-base-100 shadow-xl overflow-hidden">
    <div class="h-1 bg-success"></div>
    <div class="card-body p-5">
      <div class="flex items-start justify-between">
        <div>
          <p class="text-xs font-semibold text-base-content/50 uppercase tracking-widest">Usuarios</p>
          <p class="text-4xl font-bold text-success font-mono mt-1">{{ totalUsuarios() }}</p>
          <p class="text-xs text-base-content/40 mt-1">{{ tasaCobertura() }}% con asignación</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-success/10 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </div>
      </div>
    </div>
  </div>

</div>
