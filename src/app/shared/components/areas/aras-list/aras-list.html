@if (isSuccess()) {
<app-alert-sucess />
}
@if (isError()) {
<action-alert-error message="Acción denegada: El área cuenta con dependencias activas en el módulo de Proyectos." />
}

<div class="p-4 md:p-8 bg-base-200 min-h-screen">
  <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
    <div>
      <h1 class="text-2xl font-bold text-primary">Gestión de Áreas</h1>
      <p class="text-sm text-gray-500">Administra las áreas de la organización</p>
    </div>

    <div class="flex gap-2">
      <label for="modal-download-confirm" class="btn btn-outline btn-success shadow-md gap-2 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        Exportar Excel
      </label>

      <label for="modal-area-manual" class="btn btn-primary shadow-lg cursor-pointer" (click)="clear()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Agregar Área
      </label>
    </div>
  </div>

  <div class="card bg-base-100 shadow-xl">
    <div class="overflow-x-auto">
      <table class="table table-zebra w-full">
        <thead>
          <tr class="bg-primary text-white">
            <th class="hidden sm:table-cell">ID</th>
            <th>Imagen</th>
            <th>Nombre del Área</th>
            <th class="hidden md:table-cell">Descripción</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (item of areas(); track $index) {

          <tr>
            <th class="font-mono text-xs hidden sm:table-cell">{{ item.id }}</th>

            <td>
              <label for="modal-image-preview" class="cursor-zoom-in" (click)="clear(); getAreas(item)">
                <div class="avatar">
                  <div class="mask mask-squircle w-10 h-10 hover:scale-110 transition-transform duration-200">
                    <img [src]="item.imagen || 'assets/no-image.png'" [alt]="item.nombre" />
                  </div>
                </div>
              </label>
            </td>

            <td class="font-bold">{{ item.nombre }}</td>
            <td class="max-w-xs truncate hidden md:table-cell">{{ item.description }}</td>
            <td class="flex justify-center gap-2">
              <label for="modal-area-manual" class="btn btn-square btn-sm btn-outline btn-info cursor-pointer"
                title="Editar" (click)="clear(); getAreas(item)">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                </svg>
              </label>
              <label for="modal-delete-confirm" class="btn btn-square btn-sm btn-outline btn-error cursor-pointer"
                title="Eliminar" (click)="clear(); getAreas(item)">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </label>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
