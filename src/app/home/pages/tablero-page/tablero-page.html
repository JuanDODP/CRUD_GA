<app-navbar />

<main class="min-h-screen bg-base-200 px-4 py-6 md:px-8">

  <!-- ── Header ── -->
  <div class="flex flex-wrap items-start justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-base-content flex items-center gap-3">
        <span class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center flex-shrink-0 shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-primary-content" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
          </svg>
        </span>
        Tablero de Proyectos
      </h1>
      <p class="text-sm text-base-content/50 mt-1 ml-12">
        Vista Kanban ·
        @if (hasActiveFilters()) {
          <span class="text-primary font-medium">{{ totalVisible() }} resultado{{ totalVisible() !== 1 ? 's' : '' }}</span>
        } @else {
          <span>{{ totalVisible() }} proyectos en total</span>
        }
      </p>
    </div>

    <!-- Search -->
    <label class="input input-bordered input-sm flex items-center gap-2 w-64">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-base-content/40 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input
        type="text"
        placeholder="Buscar proyecto o área..."
        class="grow text-xs bg-transparent outline-none"
        [value]="searchQuery()"
        (input)="setSearch($event)"
      />
      @if (searchQuery()) {
        <button class="text-base-content/30 hover:text-base-content/60 transition-colors" (click)="searchQuery.set('')">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      }
    </label>
  </div>

  <!-- ── Area filter chips ── -->
  <div class="flex items-center gap-2 flex-wrap mb-6">
    <button
      class="btn btn-xs rounded-full transition-all"
      [class.btn-primary]="selectedAreaId() === null"
      [class.btn-ghost]="selectedAreaId() !== null"
      (click)="setArea(null)"
    >
      Todas las áreas
    </button>
    @for (area of areasService.areas(); track area.id) {
      <button
        class="btn btn-xs rounded-full transition-all"
        [class.btn-primary]="selectedAreaId() === area.id"
        [class.btn-ghost]="selectedAreaId() !== area.id"
        (click)="setArea(area.id)"
      >
        {{ area.nombre }}
      </button>
    }
    @if (hasActiveFilters()) {
      <button class="btn btn-xs btn-ghost text-base-content/40 ml-2" (click)="clearFilters()">
        Limpiar filtros
      </button>
    }
  </div>

  <!-- ── Kanban Board ── -->
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
    <app-tablero-columna
      titulo="Por Iniciar"
      dotClass="bg-info"
      badgeClass="badge-info"
      [items]="itemsPorIniciar()"
      [expandedId]="expandedCard()"
      (cardToggle)="toggleCard($event)"
    />
    <app-tablero-columna
      titulo="En Progreso"
      dotClass="bg-success"
      badgeClass="badge-success"
      [pulse]="true"
      [items]="itemsActivos()"
      [expandedId]="expandedCard()"
      (cardToggle)="toggleCard($event)"
    />
    <app-tablero-columna
      titulo="Por Vencer"
      dotClass="bg-warning"
      badgeClass="badge-warning"
      [items]="itemsPorVencer()"
      [expandedId]="expandedCard()"
      (cardToggle)="toggleCard($event)"
    />
    <app-tablero-columna
      titulo="Vencidos"
      dotClass="bg-error"
      badgeClass="badge-error"
      [items]="itemsVencidos()"
      [expandedId]="expandedCard()"
      (cardToggle)="toggleCard($event)"
    />
  </div>

</main>
