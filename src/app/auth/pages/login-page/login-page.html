<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card w-full max-w-sm shadow-2xl bg-base-100">
    <div class="card-body">
      <h2 class="text-3xl font-bold text-center mb-2 text-primary">¡Bienvenido!</h2>
      <p class="text-center text-sm text-gray-500 mb-6">Ingresa tus datos para continuar</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-control w-full">
          <label class="label">
            <span class="label-text font-semibold">Correo electrónico</span>
          </label>
          <input
            type="email"
            placeholder="ejemplo@correo.com"
            class="input input-bordered input-primary w-full"
            formControlName="email" />
        </div>

        <div class="form-control w-full mt-4">
          <label class="label">
            <span class="label-text font-semibold">Contraseña</span>
          </label>

          <div class="relative w-full">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              placeholder="••••••••"
              class="input input-bordered input-primary w-full pr-10"
              formControlName="password" />

            <button
              type="button"
              (click)="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-primary transition-colors focus:outline-none">

              @if (showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 012.112-3.875m9.6 9.6a9.958 9.958 0 01-4.512-2.853m-5.641-5.641a9.946 9.946 0 012.36-3.067L4.343 4.343m1.414 1.414L19.07 19.07m-1.414-1.414L15.858 15.858M21.542 12a10.05 10.05 0 00-4.838-4.838m-3.133-3.133A10.05 10.05 0 0012 5c-4.477 0-8.268 2.943-9.542 7" />
                </svg>
              }
            </button>
          </div>

          <label class="label">
            <a href="#" class="label-text-alt link link-hover">¿Olvidaste tu contraseña?</a>
          </label>
        </div>

        <div class="form-control mt-8">
          <button class="btn btn-primary text-white text-lg shadow-lg">Entrar</button>
        </div>
      </form>

      @if (hashError()) {
        <div role="alert" class="alert alert-error mt-4 shadow-md">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span class="text-sm">Por favor, ingrese credenciales válidas.</span>
        </div>
        <div class="divider text-xs text-gray-400">O</div>
      }

      <div class="text-center mt-4">
        <span class="text-sm">¿No tienes cuenta?</span>
        <a routerLink="/auth/register" class="link link-primary font-bold ml-1">Regístrate</a>
      </div>
    </div>
  </div>
</div>
