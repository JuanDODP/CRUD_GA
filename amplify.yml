version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # 👇 AQUI VA LA RUTA EXACTA DE TU COMPILADO 👇
    baseDirectory: dist/CRUDGA/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
